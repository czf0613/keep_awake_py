name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: '3.14'
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag not in (version, 'v' + version):
              raise SystemExit(f'Release tag {tag!r} must match package version {version!r}')
          PY
      - run: uv build --sdist
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      release-ref: ${{ github.event.release.tag_name || inputs.tag }}

  publish:
    needs: [source, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/keep-awake/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Assemble distributions without overwriting duplicate filenames
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          from zipfile import ZipFile
          destination = Path('dist')
          destination.mkdir()
          files = sorted(Path('artifacts').glob('*/*'))
          if not any(path.suffix == '.whl' for path in files):
              raise SystemExit('No native wheels were downloaded')
          if len([path for path in files if path.name.endswith('.tar.gz')]) != 1:
              raise SystemExit('Expected exactly one source distribution')
          for path in files:
              if not (path.suffix == '.whl' or path.name.endswith('.tar.gz')):
                  raise SystemExit(f'Unexpected artifact: {path}')
              target = destination / path.name
              if target.exists():
                  raise SystemExit(f'Duplicate distribution filename: {path.name}')
              if path.suffix == '.whl':
                  with ZipFile(path) as archive:
                      if archive.testzip() is not None:
                          raise SystemExit(f'Corrupt wheel: {path}')
              shutil.copyfile(path, target)
          print(f'Assembled {len(files)} distributions')
          PY
      - name: Publish with PyPI Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
