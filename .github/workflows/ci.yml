name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-14]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.13t', '3.14t']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install Linux test bus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon
      - name: Install dependencies and compile native extension
        run: uv sync --frozen --python '${{ matrix.python }}'
      - name: Verify selected Python version and GIL build
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          uv run --frozen --python '${{ matrix.python }}' python - <<'PY'
          import os
          import sys
          import sysconfig
          expected = os.environ['EXPECTED_PYTHON']
          actual = '{}.{}'.format(*sys.version_info[:2])
          assert actual == expected.rstrip('t'), (actual, expected)
          assert bool(sysconfig.get_config_var('Py_GIL_DISABLED')) == expected.endswith('t')
          print(sys.version)
          PY
      - name: Compile Python sources
        run: uv run --frozen --python '${{ matrix.python }}' python -m compileall -q src tests setup.py
      - name: Run tests (including no-GIL checks on free-threaded Python)
        run: uv run --frozen --python '${{ matrix.python }}' pytest -q
      - name: Build source distribution and wheel
        run: uv build --python '${{ matrix.python }}'
      - name: Validate distribution metadata
        run: uvx --python 3.14 twine check dist/*
      - name: Test the installed wheel
        shell: bash
        run: |
          uv venv --python '${{ matrix.python }}' .wheel-test
          uv pip install --python .wheel-test --no-deps dist/*.whl
          uv pip install --python .wheel-test 'pytest>=7.0.1' 'jeepney>=0.9.0'
          uv run --no-project --python .wheel-test python -m pytest -q tests
      # A py3-none-any Linux wheel would also install on Windows/macOS and hide
      # the missing native extension. Linux installs from the portable sdist.
      - name: Collect native wheels for a release
        if: github.event_name == 'release' && runner.os != 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
